{{define "account_page"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account - Mail</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="account-page">
    <h1>Account</h1>
    <p><a href="/mail/INBOX">&larr; Back to Mail</a>{{if .IsAdmin}} &middot; <a href="/admin">Admin</a>{{end}}</p>

    <p class="account-email">Signed in as <strong>{{.Email}}</strong></p>

    {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}

    <h2>Change password</h2>
    <form method="post" action="/account/password">
      <div class="field">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required autofocus>
      </div>
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary">Change password</button>
    </form>
  </div>
</body>
</html>
{{end}}
