{{define "compose_page"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compose - Mail</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="compose-page">
    <h1>Compose</h1>
    {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}
    <form method="post" action="/compose" enctype="multipart/form-data">
      <input type="hidden" name="in_reply_to" value="{{.InReplyTo}}">
      <input type="hidden" name="references" value="{{.References}}">
      <div class="field">
        <label for="to">To</label>
        <input type="text" id="to" name="to" value="{{.To}}" required autofocus>
      </div>
      <div class="field">
        <label for="cc">Cc</label>
        <input type="text" id="cc" name="cc" value="{{.Cc}}">
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" value="{{.Subject}}">
      </div>
      <div class="field">
        <label for="body">Message</label>
        <textarea id="body" name="body" rows="16">{{.Body}}</textarea>
      </div>
      <div class="field">
        <label for="attachments">Attachments</label>
        <input type="file" id="attachments" name="attachments" multiple>
      </div>
      <div class="compose-actions">
        <button type="submit" class="btn btn-primary">Send</button>
        <a class="btn" href="/mail/INBOX">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
{{end}}
